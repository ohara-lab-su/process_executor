[build-system]
requires = ["setuptools>=71.0", "coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
#name = "process-executor"
name = "proc-executor"
version = "0.1.4"

description = "Reusable multiprocessing execution support for Python controller classes."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" },
    #{ name = "Kentaro Kobayashi", email = "kobayashi@mat.shimane-u.ac.jp" }
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    # my-modules
    #"x_logger",
    "xlogger-py",
    # "packmol_util",
    # fnc
    # "pymatgen",
    # basic
    "dataclasses",
    "coloredlogs",
    "colorlog",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    # pages
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
[project.urls]
Homepage = "https://ohara-lab-su.github.io/proc_executor/"
Documentation = "https://ohara-lab-su.github.io/proc_executor/"
Repository = "https://github.com/ohara-lab-su/proc_executor"
Issues = "https://github.com/ohara-lab-su/proc_executor/issues"
